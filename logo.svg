<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">شعار عالم طفلي الذكي</title>
  <desc id="desc">شعار عربي ملوّن لموقع ألعاب تعليمية للأطفال، يتضمن قطة مرحة ونجمة</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7777"/>
      <stop offset="1" stop-color="#42cfc2"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#36b9b0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#26364a" flood-opacity=".14"/>
    </filter>
  </defs>
  <!-- خلفية الشارة -->
  <rect x="28" y="28" width="264" height="264" rx="76" fill="url(#badge)" filter="url(#shadow)"/>
  <!-- نجمة صغيرة -->
  <path d="M236 55l8 17 19 3-14 13 3 19-16-9-17 9 4-19-14-13 19-3z" fill="#ffe66d"/>
  <!-- أذنا القطة -->
  <path d="M83 135l10-65 59 43M158 113l60-43 10 65" fill="#fff7ed" stroke="#344054" stroke-width="8" stroke-linejoin="round"/>
  <path d="M105 111l-7 32 31-20M190 123l31 20-7-32" fill="#ffb3c1"/>
  <!-- وجه القطة -->
  <ellipse cx="172" cy="171" rx="79" ry="69" fill="#fff7ed" stroke="#344054" stroke-width="8"/>
  <ellipse cx="144" cy="164" rx="7" ry="10" fill="#344054"/>
  <ellipse cx="199" cy="164" rx="7" ry="10" fill="#344054"/>
  <path d="M163 181q9-9 18 0l-9 9z" fill="#ff6b6b"/>
  <path d="M172 190q-11 13-22 2M172 190q11 13 22 2" fill="none" stroke="#344054" stroke-width="5" stroke-linecap="round"/>
  <path d="M111 183l-30-5M113 195l-31 6M233 183l30-5M231 195l31 6" stroke="#344054" stroke-width="4" stroke-linecap="round"/>
  <!-- ياقة وجرس -->
  <path d="M120 226q52 31 104 0" fill="none" stroke="#ffe66d" stroke-width="13" stroke-linecap="round"/>
  <circle cx="172" cy="239" r="9" fill="#ff6b6b" stroke="#fff" stroke-width="3"/>
  <!-- الاسم والوصف -->
  <text x="850" y="145" text-anchor="end" direction="rtl" unicode-bidi="bidi-override" font-family="Tahoma, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#word)">عالم طفلي الذكي</text>
  <text x="850" y="205" text-anchor="end" direction="rtl" unicode-bidi="bidi-override" font-family="Tahoma, Arial, sans-serif" font-size="29" font-weight="600" fill="#526174">نلعب، نتعلّم، ونكتشف معًا!</text>
  <!-- زخارف مبهجة -->
  <circle cx="447" cy="89" r="8" fill="#ffe66d"/>
  <circle cx="474" cy="113" r="5" fill="#ff9f43"/>
  <path d="M433 228l5 11 12 2-9 8 2 12-10-6-10 6 2-12-9-8 12-2z" fill="#ffe66d"/>
</svg>
